services:
  # ───────── Bases de datos ─────────

  mysql:
    image: mysql:8.4
    container_name: facturacion-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: billingdb
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-auth:
    image: mysql:8.4
    container_name: auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: authdb
    ports:
      - "3308:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────── Microservicios (sin puertos publicados) ─────────

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=mysql-auth;Port=3306;Database=authdb;User=root;Password=devpassword;"
      Jwt__PrivateKeyPath: "keys/private.pem"
      Jwt__PublicKeyPath: "keys/public.pem"
      AdminSeed__Email: "admin@sistemafacturacion.local"
      AdminSeed__Password: "Admin1234"
    volumes:
      - ./src/AuthService/keys:/app/keys:ro
    depends_on:
      mysql-auth:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: src/BillingService/Dockerfile
    container_name: billing-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=billingdb;User=root;Password=devpassword;"
      Jwt__PublicKeyPath: "keys/public.pem"
    volumes:
      - ./src/BillingService/keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy

  # ───────── Gateway: el único accesible desde fuera ─────────

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__PublicKeyPath: "keys/public.pem"
      ReverseProxy__Clusters__cluster-auth__Destinations__auth-1__Address: "http://auth-service:8080/"
      ReverseProxy__Clusters__cluster-billing__Destinations__billing-1__Address: "http://billing-service:8080/"
    volumes:
      - ./src/Gateway/keys:/app/keys:ro
    depends_on:
      - auth-service
      - billing-service

volumes:
  mysql-data:
  mysql-auth-data:
